<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" type="module"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Deck of cards</title>
  </head>
  <body>
    <h1>Tag et spil krig!</h1>
    <h2>Træk et kort ved at trykke på bunken. </h2>
    <section class="content">
      <section class="game-area">
        <h2>Spiller 1</h2>
        <img
          id="draw"
          src="https://deckofcardsapi.com/static/img/back.png"
          alt="Træk et kort"
        />
        <div id="hand1"></div>
        <p id="count1" style="font-size:40px;">0</p>
      </section>

      <section class="game-area">
        <h2>Spiller 2</h2>
        <img
          id="draw2"
          src="https://deckofcardsapi.com/static/img/back.png"
          alt="Træk et kort"
        />
        <div id="hand2"></div>
        <p id="count2" style="font-size:40px;">0</p>
      </section>
    </section>

    <p id="result" style="font-size:24px; text-align:center;"></p>
  </body>
</html>
